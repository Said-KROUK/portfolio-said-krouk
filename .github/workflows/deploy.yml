name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Droits minimaux : lecture du code, écriture sur Pages uniquement
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configurer GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Installer les dépendances
        run: npm ci

      # Informatif : Next 14 reste signalé tant qu'il n'est pas migré vers Next 16
      - name: Audit de sécurité des dépendances
        run: npm audit --omit=dev --audit-level=critical || echo "::warning::Des vulnérabilités ont été détectées (voir le journal). Le site est exporté en statique, les failles serveur de Next.js ne s'appliquent pas."

      - name: Build statique
        run: npm run build
        env:
          # "/nom-du-depot" pour un site de projet, vide pour <utilisateur>.github.io
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
